[project]
name = "cramschool-api"
version = "1.0.0"
description = "補習班批改系統後端：考卷模板、批改結果、影像儲存"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "pillow>=11.0",
    "typer>=0.15",
    # RS256 verification is not something to hand-roll — getting `alg`
    # handling wrong is the single most common way OIDC integrations become
    # forgeable.
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
    "cryptography>=44.0",
]

[project.scripts]
cramctl = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Revision files are generated by `alembic revision --autogenerate` and are a
# historical record — reformatting them to satisfy a style rule would mean
# editing migrations that have already run somewhere.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags function calls in argument defaults. That is precisely how FastAPI
# declares dependencies (`db: Session = Depends(get_db)`), so the rule fires on
# every handler and reports nothing real.
ignore = ["B008"]
