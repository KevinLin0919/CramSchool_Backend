# 補習班主機上的部署。
#
# API 只綁在 127.0.0.1 —— 不是 0.0.0.0。這代表補習班 WiFi 上的其他裝置
# 連不到它，唯一的入口是主機上的 Tailscale（見 README「上線」）。少一個
# 對外埠口，就少一個要顧的東西；而且 Tailscale 會發正式的 Let's Encrypt
# 憑證，iOS 端因此可以拿掉 ATS 例外。
#
# 資料庫完全不對外，只在 compose 內部網路上。

services:
  db:
    image: postgres:17-alpine
    container_name: cram_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cramschool}
      POSTGRES_USER: ${POSTGRES_USER:-cram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cram} -d ${POSTGRES_DB:-cramschool}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [cram_net]

  api:
    build: .
    image: cram_api
    container_name: cram_api
    restart: unless-stopped
    ports:
      # 綁定位址刻意可設定，且預設是 loopback。
      #
      #   127.0.0.1     只有本機（搭配 `tailscale serve` 用）
      #   100.x.x.x     這台的 tailnet 位址 —— 只有 tailnet 內的裝置連得到
      #   192.168.x.x   補習班內網 —— 同一個 WiFi 上的老師直接連
      #
      # 不要填 0.0.0.0：那會同時開放給所有介面，包含你沒想到的那些。
      - "${API_BIND:-127.0.0.1}:8085:8085"
      # 第二個介面，因為老師和開發者從不同的網路來。
      #
      # 老師在補習班改考卷，人和伺服器在同一個 WiFi 上；要他們為此裝
      # Tailscale、註冊帳號、保持連線，是在真正的使用者出現之前就先加一道
      # 門檻（而且免費方案只有三個使用者）。開發者則相反，需要從任何地方
      # 連得到。一個綁定服務不了兩種人，所以綁兩個。
      #
      # 兩邊都是具名介面，不是 0.0.0.0：多開一個介面是決定，不是副作用。
      # 沒設定時退回 127.0.0.2 —— 一個不會跟上面那行相撞的 loopback 位址，
      # 意思是「這台沒有要開放內網」，而不是「開放給全部」。
      - "${API_BIND_LAN:-127.0.0.2}:8085:8085"
      # A third, for `tailscale funnel`, which proxies to loopback and nowhere
      # else. Off unless asked for: 127.0.0.3 is a loopback address that
      # collides with neither line above, and means "this machine is not
      # published to the internet".
      - "${API_BIND_LOCAL:-127.0.0.3}:8085:8085"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cram}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cramschool}
      DATA_DIR: /data
      # Compose reads `.env` to substitute into THIS file; it does not hand
      # those variables to the container. Named here or absent at runtime —
      # and absent here means every caller arriving through a proxy is
      # counted as the proxy, which turns a per-caller limit into one shared
      # bucket for the whole internet.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-[]}
      AUTH_RATE_LIMIT_PER_IP: ${AUTH_RATE_LIMIT_PER_IP:-10}
      AUTH_RATE_LIMIT_OVERALL: ${AUTH_RATE_LIMIT_OVERALL:-60}
      # Compose reads `.env` to substitute into THIS file; it does not hand
      # those variables to the container. Anything the app reads has to be
      # named here as well, or it is simply absent at runtime — and the
      # Microsoft endpoint's answer to "absent" is to report itself
      # unconfigured, which looks identical to never having been set up.
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_AUTO_PROVISION: ${MICROSOFT_AUTO_PROVISION:-false}
      MICROSOFT_TOKEN_DAYS: ${MICROSOFT_TOKEN_DAYS:-30}
    volumes:
      - api_data:/data
    depends_on:
      db:
        condition: service_healthy
    networks: [cram_net]

networks:
  cram_net:
    driver: bridge

volumes:
  db_data:
  api_data:
